
tfl_pipeline:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: oauth
      project: tfl-data-pipeline-stg
      dataset: dbt_dev
      location: us-central1
      threads: 4
      priority: interactive
      job_execution_timeout_seconds: 300
      job_retries: 1

    cloud:
      type: bigquery
      method: oauth
      project: "{{ env_var('DBT_GCP_PROJECT') }}"
      dataset: "{{ env_var('DBT_DATASET', 'staging') }}"
      location: "{{ env_var('DBT_BQ_LOCATION', 'us-central1') }}"
      threads: 4
      priority: interactive
      job_execution_timeout_seconds: 600
      job_retries: 1
